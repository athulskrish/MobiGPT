# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# Windows path length, character encoding, and locale settings
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Duser.country=US -Duser.language=en
# AndroidX package structure
android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=true
android.suppressUnsupportedCompileSdk=36

# NDK and native build optimizations
android.enableR8.fullMode=true

# Advanced obfuscation settings
android.enableMinification=true
android.enableShrinking=true

# Enable parallel builds for faster compilation
org.gradle.parallel=true
org.gradle.caching=true

# Resource optimizations
android.experimental.enableResourceOptimizations=false
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false

# NDK build optimizations
# Note: android.enableSeparateAnnotationProcessing was removed in AGP 4.0

# 16 KB page size support - Enable testing on 16 KB devices/emulators
# This ensures proper alignment and packaging for 16 KB page sizes
# android.experimental.testOptions.managedDevices.setupTimeoutMinutes=180
