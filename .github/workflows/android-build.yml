name: Android CI

on:
  push:
    branches: [ main, Stable ]
  pull_request:
    branches: [ main, Stable ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Setup NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r27c
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Build Device Debug APK
      run: ./gradlew assembleDeviceDebug --no-daemon
    
    - name: Run Lint
      run: ./gradlew lintDeviceDebug --no-daemon
