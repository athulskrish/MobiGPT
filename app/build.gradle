plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
}

android {
    namespace "com.keralatechreach.mobigpt"
    compileSdk 36
    ndkVersion "27.0.12077973"  // Specify NDK version for consistency

    // Windows path fix - Use shorter build directory paths
    buildDir = file("$projectDir/build")

    // Build flavors for different deployment targets
    flavorDimensions = ["deployment"]
    productFlavors {
        emulator {
            dimension "deployment"
            // 4.5.6: Software crypto, emulator-compatible (no hardware AES)
            applicationIdSuffix ".emulator"
            versionNameSuffix "-emulator"
        }
        device {
            dimension "deployment"
            // 4.10.0: Hardware AES, proper 16KB alignment for real devices
        }
    }

    defaultConfig {
        applicationId "com.keralatechreach.mobile_llm5"
        minSdk 27
        targetSdk 36
        versionCode 40
        versionName "1.3.4"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Prevent debugging conflicts
        manifestPlaceholders = [enableCrashReporting: "false"]

        // Room schema export directory for migration tracking
        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }

        // NDK configuration for llama.cpp
        // Pixel 8 Pro and modern devices use arm64-v8a
        // x86_64 for emulators (especially 16KB page emulators)
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64', 'x86'
        }



        // CMake configuration - based on working llama.cpp Android example
        // Includes 16KB page size support for Android 15+ devices
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17', '-frtti', '-fexceptions'
                arguments '-DANDROID_STL=c++_static',
                          '-DANDROID_PLATFORM=android-27',
                          '-DLLAMA_CURL=OFF',
                          '-DLLAMA_BUILD_COMMON=ON',
                          '-DGGML_LLAMAFILE=OFF',
                          '-DCMAKE_BUILD_TYPE=Release',
                          '-DCMAKE_EXE_LINKER_FLAGS=-Wl,-z,max-page-size=16384',
                          '-DCMAKE_SHARED_LINKER_FLAGS=-Wl,-z,max-page-size=16384'
            }
        }
    }

    signingConfigs {
        debug {
            storeFile file("${System.getProperty('user.home')}/.android/debug.keystore")
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            def keystorePath = project.findProperty('KEYSTORE_FILE') ?: System.getenv('KEYSTORE_FILE')
            if (keystorePath && file(keystorePath).exists()) {
                storeFile file(keystorePath)
                storePassword project.findProperty('KEYSTORE_PASSWORD') ?: System.getenv('KEYSTORE_PASSWORD') ?: ''
                keyAlias project.findProperty('KEY_ALIAS') ?: System.getenv('KEY_ALIAS') ?: ''
                keyPassword project.findProperty('KEY_PASSWORD') ?: System.getenv('KEY_PASSWORD') ?: ''
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            debuggable false
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
            zipAlignEnabled true
            crunchPngs true
        }
        debug {
            minifyEnabled false
            debuggable true
            jniDebuggable false  // Disable JNI debugging to avoid JDWP conflicts
            renderscriptDebuggable false
            zipAlignEnabled false
            crunchPngs false

            // Additional debug configuration to prevent JDWP conflicts
            manifestPlaceholders = [
                enableCrashReporting: "true",
                debugMode: "true"
            ]
        }
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    // External native build configuration for llama.cpp
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    // 16KB page size support and JNI library packaging
    packaging {
        jniLibs {
            // Use legacy packaging to extract .so files for 16KB compatibility
            // This ensures third-party libraries like SQLCipher can load properly
            useLegacyPackaging = true
            // Ensure native libraries are included
            pickFirsts += ['**/*.so']
        }
        // Prevent conflicts with duplicate files
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }

    // Lint configuration to detect issues including 16 KB page size compatibility
    lint {
        // Ensure warnings are not ignored
        abortOnError false
        warningsAsErrors false

        // Disable false-positive lint issues
        // InvalidSetHasFixedSize: RecyclerViews are bounded to parent screens but use 0dp weight or SwipeRefreshLayout
        disable += ['InvalidSetHasFixedSize']

        // Generate detailed reports
        htmlReport true
        xmlReport true
        textReport true

        // Output location
        htmlOutput file("$buildDir/reports/lint/lint-report.html")
        xmlOutput file("$buildDir/reports/lint/lint-report.xml")
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.recyclerview
    implementation libs.drawerlayout
    implementation libs.fragment
    implementation libs.viewpager2

    // AndroidX Preference for Settings
    implementation libs.preference

    // Room database dependencies
    implementation libs.room.runtime
    implementation libs.swiperefreshlayout
    annotationProcessor libs.room.compiler

    // SQLCipher for database encryption - version depends on build flavor
    // For 16KB page emulators: Use 4.10.0 with x86_64 native libs
    // Device: 4.10.0 (hardware AES, proper 16KB page alignment)
    // NOTE: x86_64 emulators need native x86_64 libs, not ARM64 translation
    implementation libs.sqlcipher.android
    implementation libs.sqlite.framework

    // AndroidX Security for encrypted SharedPreferences
    implementation libs.security.crypto

    // AndroidX Biometric for fingerprint/face authentication
    implementation libs.biometric

    // JSR305 annotations (required by Tink/security-crypto)
    implementation libs.jsr305

    // Lifecycle dependencies
    implementation libs.lifecycle.runtime.ktx
    implementation libs.lifecycle.process
    implementation libs.lifecycle.common.java8

    // WorkManager for background tasks
    implementation libs.work.runtime

    // Kotlin dependencies for coroutines (needed for LlamaEngine)
    implementation libs.core.ktx
    implementation libs.kotlinx.coroutines.android

    // Lottie for animations
    implementation libs.lottie

    // TapTargetView for interactive tutorial/showcase
    implementation libs.taptargetview

    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}
